<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fogãofy - Sabor e Tradição Mineira</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fogao: {
              yellow: '#F59E0B',      /* Amarelo Ouro / Milho */
              hoverYellow: '#FBBF24',
              brown: '#381E11',       /* Marrom Café / Barro */
              darkBrown: '#1C0D07',   /* Marrom escuro de fundo */
              black: '#0E0603',       /* Fundo principal quase preto/marrom */
              card: '#1B100B',        /* Card marrom */
              cardHover: '#2A1A12',   /* Hover do card */
              border: '#4A2A1A',      /* Borda em tom marrom acolhedor */
              subtext: '#C2A38E'      /* Texto secundário em tom bege/creme */
            }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0E0603; color: white; }
    .hero { background: linear-gradient(180deg, #422013 0%, #1C0D07 100%); }
    .modal { background: rgba(28, 13, 7, 0.97); backdrop-filter: blur(20px); border: 1px solid rgba(245, 158, 11, 0.2); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-fogao-black text-white min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const Icons = {
  Flame: ({ size = 24 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>
    </svg>
  ),
  Home: ({ size = 20 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
    </svg>
  ),
  Plus: ({ size = 18 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  ),
  Search: ({ size = 18 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
    </svg>
  ),
  Edit: ({ size = 16 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <path d="m15 5 4 4M4 20l4-.8L20 7a2.8 2.8 0 0 0-4-4L4 15z"/>
    </svg>
  ),
  Trash: ({ size = 16 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
      <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>
    </svg>
  )
};

const EMPTY = {
  nome: '',
  categoria: 'PRATO_PRINCIPAL',
  ingredientes: '',
  tempoPreparo: '',
  preco: '',
  porcao: 'SERVE_2',
  disponivel: true,
  modoPreparo: ''
};

function App() {
  const [tela, setTela] = useState('principal');
  const [apiUrl, setApiUrl] = useState('http://localhost:8080/api/pratos');
  const [urlEdit, setUrlEdit] = useState(apiUrl);
  const [showConfig, setShowConfig] = useState(false);
  const [statusApi, setStatusApi] = useState('carregando');
  const [erroDetalhe, setErroDetalhe] = useState('');
  const [pratos, setPratos] = useState([]);
  const [busca, setBusca] = useState('');
  const [filtro, setFiltro] = useState('TODOS');
  const [form, setForm] = useState(EMPTY);
  const [editando, setEditando] = useState(null);
  const [deletando, setDeletando] = useState(null);
  const [toast, setToast] = useState(null);
  const [carregando, setCarregando] = useState(false);

  const avisar = (mensagem, tipo = 'info') => {
    setToast({ mensagem, tipo });
    setTimeout(() => setToast(null), 3800);
  };

  const request = async (path = '', options = {}) => {
    const res = await fetch(`${apiUrl.replace(/\/$/, '')}${path}`, options);
    if (!res.ok) throw new Error(`A API respondeu com status ${res.status}`);
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  };

  const carregarPratos = async () => {
    setCarregando(true);
    setErroDetalhe('');
    try {
      const dados = await request();
      setPratos(Array.isArray(dados) ? dados : (dados ? [dados] : []));
      setStatusApi('conectado');
    } catch (e) {
      setStatusApi('erro');
      setErroDetalhe(e.message || 'Não foi possível conectar à API.');
    } finally {
      setCarregando(false);
    }
  };

  useEffect(() => { carregarPratos(); }, [apiUrl]);

  const salvar = async (e) => {
    e.preventDefault();
    const dados = {
      ...form,
      preco: form.preco === '' ? null : Number(form.preco),
      tempoPreparo: form.tempoPreparo === '' ? null : Number(form.tempoPreparo)
    };

    try {
      if (editando !== null) {
        await request('/' + editando, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        avisar('Prato atualizado no cardápio!', 'sucesso');
      } else {
        await request('', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });
        avisar('Prato cadastrado no cardápio!', 'sucesso');
      }
      setForm(EMPTY);
      setEditando(null);
      setTela('principal');
      await carregarPratos();
    } catch (err) {
      avisar(`Não foi possível salvar. ${err.message}`, 'erro');
    }
  };

  const editar = (p) => {
    setForm({
      nome: p.nome || '',
      categoria: p.categoria || 'PRATO_PRINCIPAL',
      ingredientes: p.ingredientes || '',
      tempoPreparo: p.tempoPreparo ?? '',
      preco: p.preco ?? '',
      porcao: p.porcao || 'SERVE_2',
      disponivel: p.disponivel ?? true,
      modoPreparo: p.modoPreparo || ''
    });
    setEditando(p.id);
    setTela('cadastro');
  };

  const excluir = async (id) => {
    try {
      await request('/' + id, { method: 'DELETE' });
      avisar('Prato removido do cardápio!', 'sucesso');
      setDeletando(null);
      await carregarPratos();
    } catch (err) {
      avisar(`Não foi possível excluir. ${err.message}`, 'erro');
    }
  };

  const filtrados = useMemo(() => pratos.filter(p => {
    const texto = [p.nome, p.categoria, p.ingredientes].filter(Boolean).join(' ').toLowerCase();
    return texto.includes(busca.toLowerCase()) && (filtro === 'TODOS' || p.categoria === filtro);
  }), [pratos, busca, filtro]);

  const principais = pratos.filter(p => p.categoria === 'PRATO_PRINCIPAL').length;
  const sobremesas = pratos.filter(p => p.categoria === 'SOBREMESA').length;

  const field = "w-full bg-[#120704] border border-fogao-border rounded-lg p-3 text-sm text-white focus:outline-none focus:border-fogao-yellow transition";
  const label = "block text-fogao-subtext font-bold mb-1.5 uppercase tracking-wider text-[10px]";

  return (
    <div className="flex min-h-screen bg-fogao-black text-white">
      {toast && (
        <div className={`fixed top-5 right-5 z-[70] px-4 py-3 rounded-xl text-xs font-semibold shadow-2xl border ${
          toast.tipo === 'sucesso' 
            ? 'bg-[#1C0D07] text-amber-300 border-amber-500/40' 
            : toast.tipo === 'erro' 
            ? 'bg-[#1C0D07] text-rose-400 border-rose-500/40' 
            : 'bg-[#1C0D07] text-white border-neutral-700'
        }`}>
          {toast.mensagem}
        </div>
      )}

      {/* Sidebar / Navegação */}
      <aside className="w-64 bg-[#0A0402] p-5 hidden md:flex flex-col justify-between border-r border-fogao-border">
        <div className="space-y-8">
          <div className="flex items-center gap-3 px-2">
            <span className="text-fogao-yellow"><Icons.Flame size={32}/></span>
            <span className="text-2xl font-extrabold tracking-tight">fogão<span className="text-fogao-yellow">fy</span></span>
          </div>
          <nav className="space-y-2">
            <button 
              onClick={() => setTela('principal')} 
              className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-bold transition ${
                tela === 'principal' ? 'bg-fogao-cardHover text-fogao-yellow' : 'text-fogao-subtext hover:text-white'
              }`}
            >
              <Icons.Home/> Cardápio Mineiro
            </button>
            <button 
              onClick={() => { setForm(EMPTY); setEditando(null); setTela('cadastro'); }} 
              className={`w-full flex items-center gap-3 px-3 py-3 rounded-lg text-sm font-bold transition ${
                tela === 'cadastro' ? 'bg-fogao-cardHover text-fogao-yellow' : 'text-fogao-subtext hover:text-white'
              }`}
            >
              <Icons.Plus/> Cadastrar Prato
            </button>
          </nav>
        </div>

        {/* Backend Status Box */}
        <div className="bg-fogao-card p-3 rounded-xl border border-fogao-border">
          <span className="text-fogao-subtext block text-[10px] uppercase font-bold mb-1">API do Restaurante</span>
          <div className="text-[11px] font-mono break-all mb-3 text-amber-200/80">{apiUrl}</div>
          <div className="flex items-center justify-between gap-2">
            <span className="flex items-center gap-2 text-xs">
              <span className={`w-2 h-2 rounded-full ${
                statusApi === 'conectado' ? 'bg-amber-400' : statusApi === 'carregando' ? 'bg-amber-600' : 'bg-rose-500'
              }`}></span>
              {statusApi === 'conectado' ? 'Conectada' : statusApi === 'carregando' ? 'Conectando' : 'Erro de conexão'}
            </span>
            <button onClick={() => { setUrlEdit(apiUrl); setShowConfig(true); }} className="text-xs text-fogao-yellow hover:underline font-semibold">Alterar</button>
          </div>
        </div>
      </aside>

      {/* Áreas Principais */}
      <main className="flex-1 min-w-0">
        {/* Header */}
        <header className="sticky top-0 z-30 bg-[#0E0603]/90 backdrop-blur border-b border-fogao-border px-5 md:px-8 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3 md:hidden">
            <span className="text-fogao-yellow"><Icons.Flame size={26}/></span>
            <b className="text-xl tracking-tight">fogão<span className="text-fogao-yellow">fy</span></b>
          </div>
          <div className="hidden md:block text-xs text-fogao-subtext font-medium">
            RESTAURANTE MINEIRO / <span className="text-amber-400 font-bold">{tela === 'cadastro' ? 'NOVO PRATO' : 'CARDÁPIO'}</span>
          </div>
          <div className="flex gap-2">
            <button 
              onClick={() => carregarPratos()} 
              className="px-3 py-2 rounded-full border border-fogao-border text-xs font-bold hover:bg-fogao-card transition text-fogao-subtext hover:text-white"
            >
              {carregando ? 'Atualizando...' : '↻ Atualizar'}
            </button>
            <button 
              onClick={() => { setForm(EMPTY); setEditando(null); setTela('cadastro'); }} 
              className="flex items-center gap-2 px-4 py-2 rounded-full bg-fogao-yellow text-fogao-darkBrown text-xs font-extrabold hover:bg-fogao-hoverYellow transition"
            >
              <Icons.Plus/> Novo Prato
            </button>
          </div>
        </header>

        <div className="p-5 md:p-8 max-w-7xl mx-auto">
          {tela === 'principal' ? (
            <>
              {/* Hero Banner */}
              <section className="hero rounded-2xl p-7 md:p-10 mb-7 border border-fogao-border relative overflow-hidden">
                <p className="text-fogao-yellow text-xs uppercase tracking-[.25em] font-extrabold mb-3">Tradição do fogão a lenha</p>
                <h1 className="text-3xl md:text-5xl font-extrabold tracking-tight mb-3">
                  O autêntico sabor de <span className="text-fogao-yellow">Minas Gerais.</span>
                </h1>
                <p className="text-fogao-subtext max-w-xl text-sm leading-6">
                  Gerencie o cardápio, pratos típicos e receitas da casa. Altere preços e disponibilidades sincronizando direto com sua API.
                </p>
              </section>

              {/* Erro de Conexão */}
              {statusApi === 'erro' && (
                <div className="mb-5 rounded-xl border border-rose-500/30 bg-rose-500/10 p-4 text-sm">
                  <b className="text-rose-300">Não foi possível conectar à API do restaurante.</b>
                  <p className="text-fogao-subtext mt-1">{erroDetalhe}</p>
                  <button onClick={() => { setUrlEdit(apiUrl); setShowConfig(true); }} className="mt-3 text-fogao-yellow font-bold hover:underline">
                    Configurar URL do Backend
                  </button>
                </div>
              )}

              {/* Estatísticas rápidas */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-7">
                <div className="bg-fogao-card border border-fogao-border rounded-xl p-5">
                  <p className="text-fogao-subtext text-xs font-bold uppercase">Total de Pratos</p>
                  <p className="text-3xl font-extrabold mt-2 text-amber-100">{pratos.length}</p>
                </div>
                <div className="bg-fogao-card border border-fogao-border rounded-xl p-5">
                  <p className="text-fogao-subtext text-xs font-bold uppercase">Pratos Principais</p>
                  <p className="text-3xl font-extrabold mt-2 text-amber-100">{principais}</p>
                </div>
                <div className="bg-fogao-card border border-fogao-border rounded-xl p-5">
                  <p className="text-fogao-subtext text-xs font-bold uppercase">Sobremesas Típicas</p>
                  <p className="text-3xl font-extrabold mt-2 text-amber-100">{sobremesas}</p>
                </div>
              </div>

              {/* Filtros e Busca */}
              <div className="flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-5">
                <div>
                  <h2 className="text-xl font-extrabold text-amber-100">Pratos Cadastrados</h2>
                  <p className="text-fogao-subtext text-xs mt-1">Lista de delícias mineiras sincronizadas via API REST</p>
                </div>
                <div className="flex flex-col sm:flex-row gap-2">
                  <div className="flex items-center gap-2 bg-[#120704] border border-fogao-border rounded-full px-4 text-fogao-subtext">
                    <Icons.Search/>
                    <input 
                      value={busca} 
                      onChange={e => setBusca(e.target.value)} 
                      placeholder="Buscar tutu, feijoada..." 
                      className="bg-transparent py-2.5 text-sm text-white outline-none w-full sm:w-48 placeholder:text-fogao-subtext/60"
                    />
                  </div>
                  <select 
                    value={filtro} 
                    onChange={e => setFiltro(e.target.value)} 
                    className="bg-[#120704] border border-fogao-border rounded-full px-4 py-2.5 text-sm text-white outline-none"
                  >
                    <option value="TODOS">Todas as categorias</option>
                    <option value="ENTRADA">Entradas & Tira-gostos</option>
                    <option value="PRATO_PRINCIPAL">Pratos Principais</option>
                    <option value="SOBREMESA">Sobremesas Típicas</option>
                    <option value="BEBIDA">Bebidas & Cachaças</option>
                  </select>
                </div>
              </div>

              {/* Lista de Pratos */}
              {carregando && pratos.length === 0 ? (
                <div className="text-center py-16 text-fogao-subtext">Buscando receitas no fogão a lenha...</div>
              ) : filtrados.length === 0 ? (
                <div className="bg-fogao-card border border-fogao-border rounded-2xl p-12 text-center">
                  <div className="text-fogao-yellow flex justify-center mb-4"><Icons.Flame size={48}/></div>
                  <h3 className="font-extrabold text-lg">{statusApi === 'erro' ? 'Não foi possível carregar o cardápio' : 'Nenhum prato encontrado'}</h3>
                  <p className="text-fogao-subtext text-sm mt-2">
                    {statusApi === 'erro' ? 'Verifique a conexão com o servidor.' : 'Cadastre sua primeira receita mineira ou altere os filtros.'}
                  </p>
                  <button 
                    onClick={() => { setForm(EMPTY); setEditando(null); setTela('cadastro'); }} 
                    className="mt-5 inline-flex items-center gap-2 rounded-full bg-fogao-yellow text-fogao-darkBrown px-5 py-3 font-extrabold text-sm"
                  >
                    <Icons.Plus/> Cadastrar Prato
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                  {filtrados.map((p, i) => (
                    <article key={p.id ?? i} className="bg-fogao-card border border-fogao-border rounded-2xl p-5 hover:bg-fogao-cardHover transition flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start gap-3">
                          <div className="flex gap-3 min-w-0">
                            <div className="w-12 h-12 shrink-0 rounded-xl bg-fogao-yellow/10 text-fogao-yellow flex items-center justify-center">
                              <Icons.Flame size={26}/>
                            </div>
                            <div className="min-w-0">
                              <h3 className="font-extrabold text-lg text-amber-100 truncate">{p.nome || 'Prato Sem Nome'}</h3>
                              <p className="text-fogao-subtext text-xs mt-1">
                                {p.categoria?.replace('_', ' ') || 'Geral'} {p.tempoPreparo ? `· ${p.tempoPreparo} min` : ''}
                              </p>
                            </div>
                          </div>
                          <span className="text-[10px] font-bold bg-[#2A150C] text-fogao-yellow px-2.5 py-1 rounded-full border border-fogao-border shrink-0">
                            #{p.id ?? '—'}
                          </span>
                        </div>

                        <div className="grid grid-cols-2 gap-2 mt-5 text-xs">
                          <div className="bg-[#120704] rounded-lg p-2.5 border border-fogao-border/50">
                            <p className="text-fogao-subtext text-[10px] uppercase font-bold mb-0.5">Preço</p>
                            <b className="text-amber-300 text-sm">{p.preco != null ? `R$ ${Number(p.preco).toFixed(2)}` : 'A consultar'}</b>
                          </div>
                          <div className="bg-[#120704] rounded-lg p-2.5 border border-fogao-border/50">
                            <p className="text-fogao-subtext text-[10px] uppercase font-bold mb-0.5">Porção</p>
                            <b>{p.porcao?.replace('_', ' ') || 'Padrão'}</b>
                          </div>
                        </div>

                        {p.ingredientes && (
                          <p className="text-xs text-fogao-subtext mt-4 line-clamp-2">
                            <strong className="text-amber-200/70">Ingredientes:</strong> {p.ingredientes}
                          </p>
                        )}
                      </div>

                      <div className="flex gap-2 mt-5 pt-4 border-t border-fogao-border/60">
                        <button 
                          onClick={() => editar(p)} 
                          className="flex-1 flex items-center justify-center gap-2 rounded-lg border border-fogao-border py-2 text-xs font-bold hover:bg-[#2A150C] transition text-amber-100"
                        >
                          <Icons.Edit/> Editar
                        </button>
                        <button 
                          onClick={() => setDeletando(p.id)} 
                          className="flex-1 flex items-center justify-center gap-2 rounded-lg border border-rose-900/50 text-rose-300 py-2 text-xs font-bold hover:bg-rose-500/10 transition"
                        >
                          <Icons.Trash/> Excluir
                        </button>
                      </div>
                    </article>
                  ))}
                </div>
              )}
              <p className="text-[10px] text-fogao-subtext/70 mt-6 font-mono">Endpoint ativo: {apiUrl} (Suporta GET, POST, PUT, DELETE)</p>
            </>
          ) : (
            /* Formulário de Cadastro/Edição */
            <section className="max-w-3xl mx-auto">
              <button 
                onClick={() => { setTela('principal'); setEditando(null); setForm(EMPTY); }} 
                className="text-fogao-subtext hover:text-white text-sm mb-5 transition flex items-center gap-2"
              >
                ← Voltar para o cardápio
              </button>
              
              <div className="bg-fogao-card border border-fogao-border rounded-2xl overflow-hidden">
                <div className="hero p-6 md:p-8 border-b border-fogao-border">
                  <p className="text-fogao-yellow text-xs font-extrabold uppercase tracking-[.2em] mb-2">Receitas de Minas</p>
                  <h1 className="text-2xl md:text-3xl font-extrabold text-amber-100">
                    {editando !== null ? 'Editar Prato' : 'Cadastrar Novo Prato'}
                  </h1>
                  <p className="text-fogao-subtext text-sm mt-2">
                    Preencha os detalhes da receita para atualizar o cardápio no sistema.
                  </p>
                </div>

                <form onSubmit={salvar} className="p-6 md:p-8 space-y-5">
                  <div>
                    <label className={label}>Nome do Prato *</label>
                    <input 
                      required 
                      value={form.nome} 
                      onChange={e => setForm({ ...form, nome: e.target.value })} 
                      placeholder="Ex.: Feijão Tropeiro Completo" 
                      className={field}
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className={label}>Categoria *</label>
                      <select 
                        required 
                        value={form.categoria} 
                        onChange={e => setForm({ ...form, categoria: e.target.value })} 
                        className={field}
                      >
                        {[
                          ['ENTRADA', 'Entradas & Tira-gostos'],
                          ['PRATO_PRINCIPAL', 'Prato Principal'],
                          ['SOBREMESA', 'Sobremesa Típica'],
                          ['BEBIDA', 'Bebida / Cachaça'],
                          ['ACOMPANHAMENTO', 'Acompanhamento']
                        ].map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className={label}>Servimento / Porção</label>
                      <select 
                        value={form.porcao} 
                        onChange={e => setForm({ ...form, porcao: e.target.value })} 
                        className={field}
                      >
                        <option value="INDIVIDUAL">Individual</option>
                        <option value="SERVE_2">Serve 2 pessoas</option>
                        <option value="FAMILIA">Família (3 a 4 pessoas)</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className={label}>Preço (R$)</label>
                      <input 
                        type="number" 
                        min="0" 
                        step="0.01" 
                        value={form.preco} 
                        onChange={e => setForm({ ...form, preco: e.target.value })} 
                        placeholder="Ex.: 45.90" 
                        className={field}
                      />
                    </div>
                    <div>
                      <label className={label}>Tempo de Preparo (minutos)</label>
                      <input 
                        type="number" 
                        min="0" 
                        value={form.tempoPreparo} 
                        onChange={e => setForm({ ...form, tempoPreparo: e.target.value })} 
                        placeholder="Ex.: 30" 
                        className={field}
                      />
                    </div>
                  </div>

                  <div>
                    <label className={label}>Ingredientes Principais</label>
                    <input 
                      value={form.ingredientes} 
                      onChange={e => setForm({ ...form, ingredientes: e.target.value })} 
                      placeholder="Ex.: Feijão, couve, torresmo, ovo, farinha de mandioca..." 
                      className={field}
                    />
                  </div>

                  <div>
                    <label className={label}>Modo de Preparo / Observações do Chef</label>
                    <textarea 
                      rows="3" 
                      value={form.modoPreparo} 
                      onChange={e => setForm({ ...form, modoPreparo: e.target.value })} 
                      placeholder="Detalhes do preparo ou avisos sobre alergConfigure..." 
                      className={field}
                    ></textarea>
                  </div>

                  <div className="flex flex-col-reverse sm:flex-row gap-3 pt-2">
                    <button 
                      type="button" 
                      onClick={() => { setTela('principal'); setEditando(null); setForm(EMPTY); }} 
                      className="flex-1 py-3 rounded-full border border-fogao-border font-bold text-sm hover:bg-[#2A150C] transition"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 py-3 rounded-full bg-fogao-yellow hover:bg-fogao-hoverYellow text-fogao-darkBrown font-extrabold text-sm transition"
                    >
                      {editando !== null ? 'Salvar Alterações (PUT)' : 'Cadastrar no Cardápio (POST)'}
                    </button>
                  </div>
                </form>
              </div>
            </section>
          )}
        </div>
      </main>

      {/* Modal Configuração API */}
      {showConfig && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="modal max-w-lg w-full p-6 rounded-2xl space-y-5">
            <div className="flex justify-between items-center border-b border-fogao-border/50 pb-3">
              <h3 className="font-extrabold text-amber-100">Configurar Endpoint do Backend</h3>
              <button onClick={() => setShowConfig(false)} className="text-fogao-subtext text-xl">×</button>
            </div>
            <p className="text-fogao-subtext text-sm">
              Insira a URL base do seu servidor REST. O front-end executará chamadas GET, POST, PUT e DELETE para gerenciar os pratos.
            </p>
            <div>
              <label className={label}>URL Base da API</label>
              <input 
                value={urlEdit} 
                onChange={e => setUrlEdit(e.target.value)} 
                placeholder="http://localhost:8080/api/pratos" 
                className={field}
              />
            </div>
            <div className="flex gap-3">
              <button onClick={() => setShowConfig(false)} className="flex-1 py-3 rounded-full border border-fogao-border font-bold text-sm">
                Cancelar
              </button>
              <button 
                onClick={() => {
                  if (urlEdit.trim()) {
                    setApiUrl(urlEdit.trim().replace(/\/$/, ''));
                    setShowConfig(false);
                  }
                }} 
                className="flex-1 py-3 rounded-full bg-fogao-yellow text-fogao-darkBrown font-extrabold text-sm"
              >
                Salvar e Testar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Modal Confirmar Exclusão */}
      {deletando !== null && (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="modal max-w-sm w-full p-6 rounded-2xl text-center space-y-5">
            <div className="mx-auto w-12 h-12 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center">
              <Icons.Trash size={22}/>
            </div>
            <h3 className="font-extrabold text-lg text-amber-100">Remover este prato?</h3>
            <p className="text-fogao-subtext text-sm">
              Esta ação enviará a requisição <code className="text-rose-300">DELETE {apiUrl}/{deletando}</code> para a API.
            </p>
            <div className="flex gap-3">
              <button onClick={() => setDeletando(null)} className="flex-1 py-3 rounded-full bg-[#2A150C] font-bold text-sm text-fogao-subtext">
                Cancelar
              </button>
              <button onClick={() => excluir(deletando)} className="flex-1 py-3 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-extrabold text-sm">
                Remover
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
